<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Austin Stickley — Back shortly</title>
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f%5B%5D=switzer@400,500,600,700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" />
    <style>
      :root {
        --bg: #0A0A0A;
        --ink: #FAFAFA;
        --ink-60: rgba(250, 250, 250, 0.6);
        --ink-35: rgba(250, 250, 250, 0.35);
        --ink-12: rgba(250, 250, 250, 0.12);
        --accent: #B5FE2C;
        --sans: 'Switzer', system-ui, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        display: grid;
        place-items: center;
        min-height: 100vh;
        overflow: hidden;
        position: relative;
      }
      /* subtle dot grid */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: radial-gradient(rgba(250,250,250,0.04) 1px, transparent 1px);
        background-size: 24px 24px;
        pointer-events: none;
      }
      /* ambient glow */
      body::after {
        content: '';
        position: fixed;
        top: -30%;
        left: 50%;
        transform: translateX(-50%);
        width: 800px;
        height: 800px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(181,254,44,0.10) 0%, transparent 60%);
        pointer-events: none;
      }
      .wrap {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 32px;
        max-width: 640px;
      }
      .top-bar {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: var(--accent);
        z-index: 2;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-60);
        border: 1px solid var(--ink-12);
        border-radius: 4px;
        padding: 8px 14px;
        margin-bottom: 40px;
      }
      .dot {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.8); }
      }
      h1 {
        font-weight: 700;
        font-size: clamp(38px, 8vw, 76px);
        line-height: 1.0;
        letter-spacing: -0.03em;
        margin-bottom: 24px;
      }
      h1 em {
        font-style: italic;
        font-weight: 500;
        color: var(--accent);
      }
      p {
        font-size: clamp(15px, 2.2vw, 18px);
        line-height: 1.6;
        color: var(--ink-60);
        max-width: 460px;
        margin: 0 auto 40px;
      }
      .meta {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-35);
      }
      .meta a { color: var(--ink-60); text-decoration: none; transition: color 0.2s; }
      .meta a:hover { color: var(--accent); }
      .name {
        position: fixed;
        bottom: 28px;
        left: 0; right: 0;
        text-align: center;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink-35);
      }
      /* animated build bar */
      .buildbar {
        width: 200px;
        height: 2px;
        background: var(--ink-12);
        border-radius: 2px;
        margin: 0 auto 40px;
        overflow: hidden;
        position: relative;
      }
      .buildbar span {
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 40%;
        background: var(--accent);
        border-radius: 2px;
        animation: slide 1.8s ease-in-out infinite;
      }
      @keyframes slide {
        0% { left: -40%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="top-bar"></div>
    <div class="wrap">
      <div class="badge"><span class="dot"></span> Under maintenance</div>
      <h1>Shipping <em>improvements.</em></h1>
      <div class="buildbar"><span></span></div>
      <p>
        The site is getting an upgrade right now. It&rsquo;ll be back in a few minutes,
        sharper than before. Thanks for the patience.
      </p>
      <div class="meta">
        <a href="mailto:ams@stickleyai.com">ams@stickleyai.com</a>
        <span>·</span>
        <a href="https://github.com/astickleyid" target="_blank" rel="noreferrer">github.com/astickleyid</a>
      </div>
    </div>
    <div class="name">Austin Stickley — AI Product Engineer</div>
  </body>
</html>
